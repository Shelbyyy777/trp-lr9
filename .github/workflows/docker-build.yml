name: Docker Build Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Проверка кода из репозитория
        uses: actions/checkout@v6

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Сборка Docker-образа в облаке GitHub
        run: |
          docker build -t test-app:latest .
          echo "Образ собран!"
          docker image ls test-app

      - name: Проверка контейнера по HTTP
        run: |
          docker run -d --rm --name lr9-test -p 127.0.0.1:8080:8080 test-app:latest
          trap 'docker logs lr9-test; docker stop lr9-test >/dev/null' EXIT

          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 2 --max-time 5 --output /dev/null http://127.0.0.1:8080/

          response=$(curl --fail --silent --show-error --max-time 5 \
            'http://127.0.0.1:8080/api/days-until?date=2030-01-01')
          echo "$response"
          printf '%s\n' "$response" | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data["eventDate"] == "2030-01-01" and isinstance(data["days"], int)'
